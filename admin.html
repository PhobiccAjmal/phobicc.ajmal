<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Phobicc_ajmall</title>

<link rel="stylesheet" href="style.css">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   ADMIN PAGE EXTRA DESIGN
========================= */

.admin-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}


.admin-container{
    width:100%;
    max-width:650px;
    background:#111;
    border:1px solid #292929;
    border-radius:25px;
    padding:35px;
}


.admin-container h1{
    text-align:center;
    margin-bottom:30px;

    background:linear-gradient(
        90deg,
        #00c6ff,
        #0072ff,
        #8a2be2,
        #ff00cc,
        #00c6ff
    );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:rainbowMove 5s linear infinite;
}


#loginBox,
#resetBox,
#adminPanel{
    flex-direction:column;
    gap:15px;
}


.admin-container input,
.admin-container textarea{
    width:100%;
    padding:15px;
    background:#222;
    border:1px solid #333;
    border-radius:12px;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}


.admin-container textarea{
    min-height:110px;
    resize:vertical;
}


.admin-container button{
    padding:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}


.login-btn,
.upload-btn,
.reset-btn{
    background:linear-gradient(
        90deg,
        #0072ff,
        #00c6ff
    );

    color:white;
}


.forgot-btn{
    background:transparent;
    color:#00c6ff;
    border:1px solid #00c6ff !important;
}


.back-login-btn{
    background:#333;
    color:white;
}


.logout-btn{
    background:#b22222;
    color:white;
}


.status{
    text-align:center;
    color:#aaa;
    min-height:20px;
    line-height:1.5;
}


/* =========================
   MANAGE MEDIA
========================= */

.media-manager{
    margin-top:30px;
    border-top:1px solid #333;
    padding-top:25px;
}


.media-manager h2{
    text-align:center;
    color:white;
}


.admin-media-item{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
}


.admin-media-item img,
.admin-media-item video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:10px;
    background:#000;
}


.admin-media-description{
    margin-top:12px;
    color:#ddd;
    word-break:break-word;
}


.admin-media-details{
    margin-top:8px;
    color:#999;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
}


.delete-btn{
    width:100%;
    margin-top:15px;
    background:#b22222;
    color:white;
}


.delete-btn:hover{
    opacity:0.85;
}

</style>

</head>



<body class="admin-page">


<div class="admin-container">


    <h1>Phobicc_ajmall Admin</h1>


    <!-- =========================
         LOGIN BOX
    ========================== -->

    <div
        id="loginBox"
        style="display:flex"
    >

        <input
            type="email"
            id="username"
            placeholder="Admin Email"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            placeholder="Admin Password"
            autocomplete="current-password"
        >


        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>


        <button
            class="forgot-btn"
            onclick="forgotPassword()"
        >
            Forgot Password?
        </button>


        <div
            id="loginStatus"
            class="status"
        ></div>

    </div>



    <!-- =========================
         PASSWORD RESET BOX
    ========================== -->

    <div
        id="resetBox"
        style="display:none"
    >

        <h2 style="text-align:center;color:white;">
            Create New Password
        </h2>


        <input
            type="password"
            id="newPassword"
            placeholder="New Password"
            autocomplete="new-password"
        >


        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
            autocomplete="new-password"
        >


        <button
            class="reset-btn"
            onclick="updatePassword()"
        >
            Update Password
        </button>


        <div
            id="resetStatus"
            class="status"
        ></div>

    </div>



    <!-- =========================
         ADMIN PANEL
    ========================== -->

    <div
        id="adminPanel"
        style="display:none"
    >


        <h2>Upload Photo or Video</h2>


        <!-- FILE SELECT -->

        <input
            type="file"
            id="media"
            accept="image/*,video/*"
        >


        <!-- DESCRIPTION -->

        <textarea
            id="description"
            placeholder="Write description here..."
        ></textarea>


        <!-- DETAILS -->

        <textarea
            id="details"
            placeholder="Write details here..."
        ></textarea>


        <!-- UPLOAD BUTTON -->

        <button
            class="upload-btn"
            onclick="uploadMedia()"
        >
            Upload Photo / Video
        </button>


        <!-- UPLOAD STATUS -->

        <div
            id="uploadStatus"
            class="status"
        ></div>



        <!-- =========================
             MANAGE UPLOADED MEDIA
        ========================== -->

        <div class="media-manager">

            <h2>Manage Uploaded Media</h2>

            <div id="mediaList">
                Loading...
            </div>

        </div>



        <!-- LOGOUT -->

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>


        <br>


        <!-- BACK TO WEBSITE -->

        <a
            href="index.html"
            class="admin-button"
            style="text-align:center"
        >
            ← Back to Website
        </a>


    </div>


</div>



<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://nyynuenoweujnmnrzqdp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_YCgX3_wvq0Y5q0N3h1_RJg_1N2wGCs7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   LIVE ADMIN PAGE URL
===================================================== */

const ADMIN_URL =
    window.location.origin +
    window.location.pathname;


/* =====================================================
   CHECK LOGIN / SESSION
===================================================== */

async function checkAdmin(){

    try{

        const {
            data: {
                session
            }
        } = await supabase.auth.getSession();


        if(session){

            showAdminPanel();

        }
        else{

            document
                .getElementById("loginBox")
                .style.display = "flex";

            document
                .getElementById("adminPanel")
                .style.display = "none";

        }

    }
    catch(error){

        console.error(
            "Session check error:",
            error
        );

    }

}


/* =====================================================
   SHOW ADMIN PANEL
===================================================== */

function showAdminPanel(){

    document
        .getElementById("loginBox")
        .style.display = "none";


    document
        .getElementById("resetBox")
        .style.display = "none";


    document
        .getElementById("adminPanel")
        .style.display = "flex";


    if(typeof loadMedia === "function"){

        loadMedia();

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const status =
        document
            .getElementById("loginStatus");


    if(!email || !password){

        status.textContent =
            "Please enter email and password.";

        return;

    }


    status.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


    if(error){

        status.textContent =
            "Login failed: " +
            error.message;

        return;

    }


    if(data.session){

        status.textContent =
            "Login successful!";


        showAdminPanel();

    }

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

async function forgotPassword(){

    const email =
        document
            .getElementById("username")
            .value
            .trim();


    const status =
        document
            .getElementById("loginStatus");


    if(!email){

        status.textContent =
            "Enter your admin email first.";

        return;

    }


    status.textContent =
        "Sending password reset email...";


    const {
        error
    } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo: ADMIN_URL
            }
        );


    if(error){

        status.textContent =
            "Reset email failed: " +
            error.message;

        return;

    }


    status.textContent =
        "Password reset email sent. Check your email.";

}


/* =====================================================
   SUPABASE PASSWORD RECOVERY EVENT
===================================================== */

supabase.auth.onAuthStateChange(
    async function(event, session){

        console.log(
            "Auth event:",
            event
        );


        if(event === "PASSWORD_RECOVERY"){

            document
                .getElementById("loginBox")
                .style.display = "none";


            document
                .getElementById("adminPanel")
                .style.display = "none";


            document
                .getElementById("resetBox")
                .style.display = "flex";

        }

    }
);


/* =====================================================
   UPDATE PASSWORD
===================================================== */

async function updatePassword(){

    const newPassword =
        document
            .getElementById("newPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    const status =
        document
            .getElementById("resetStatus");


    if(!newPassword || !confirmPassword){

        status.textContent =
            "Please enter both password fields.";

        return;

    }


    if(newPassword.length < 6){

        status.textContent =
            "Password must be at least 6 characters.";

        return;

    }


    if(newPassword !== confirmPassword){

        status.textContent =
            "Passwords do not match.";

        return;

    }


    status.textContent =
        "Updating password...";


    const {
        error
    } =
        await supabase.auth.updateUser({

            password: newPassword

        });


    if(error){

        status.textContent =
            "Password update failed: " +
            error.message;

        return;

    }


    status.textContent =
        "Password updated successfully!";


    document
        .getElementById("newPassword")
        .value = "";


    document
        .getElementById("confirmPassword")
        .value = "";


    setTimeout(
        function(){

            showLoginBox();

        },
        2000
    );

}


/* =====================================================
   SHOW LOGIN BOX
===================================================== */

function showLoginBox(){

    document
        .getElementById("resetBox")
        .style.display = "none";


    document
        .getElementById("adminPanel")
        .style.display = "none";


    document
        .getElementById("loginBox")
        .style.display = "flex";


    document
        .getElementById("loginStatus")
        .textContent =
            "You can now login with your new password.";

}


/* =====================================================
   UPLOAD MEDIA
===================================================== */

async function uploadMedia(){

    const file =
        document
            .getElementById("media")
            .files[0];


    const description =
        document
            .getElementById("description")
            .value;


    const details =
        document
            .getElementById("details")
            .value;


    const status =
        document
            .getElementById("uploadStatus");


    if(!file){

        status.textContent =
            "Please select a photo or video.";

        return;

    }


    const formData =
        new FormData();


    formData.append(
        "media",
        file
    );


    formData.append(
        "description",
        description
    );


    formData.append(
        "details",
        details
    );


    status.textContent =
        "Uploading... Please wait.";


    try{

        const response =
            await fetch(
                "/api/upload",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(data.success){

            status.textContent =
                "Upload successful!";


            document
                .getElementById("media")
                .value = "";


            document
                .getElementById("description")
                .value = "";


            document
                .getElementById("details")
                .value = "";


            loadMedia();

        }
        else{

            status.textContent =
                data.message ||
                "Upload failed.";

        }

    }
    catch(error){

        console.error(error);

        status.textContent =
            "Upload error. Check server.";

    }

}


/* =====================================================
   LOAD MEDIA
===================================================== */

async function loadMedia(){

    const mediaList =
        document
            .getElementById("mediaList");


    mediaList.innerHTML =
        "Loading media...";


    try{

        const response =
            await fetch(
                "/api/media"
            );


        const mediaItems =
            await response.json();


        if(!mediaItems.length){

            mediaList.innerHTML =
                "No media uploaded yet.";

            return;

        }


        mediaList.innerHTML = "";


        mediaItems.forEach(
            function(item){

                const container =
                    document.createElement(
                        "div"
                    );


                container.className =
                    "admin-media-item";


                let mediaElement;


                if(item.type === "video"){

                    mediaElement = `
                        <video
                            controls
                            src="/uploads/${item.filename}"
                        ></video>
                    `;

                }
                else{

                    mediaElement = `
                        <img
                            src="/uploads/${item.filename}"
                            alt="Uploaded media"
                        >
                    `;

                }


                container.innerHTML = `

                    ${mediaElement}

                    <div
                        class="admin-media-description"
                    >

                        <strong>
                            Description:
                        </strong>

                        <br>

                        ${
                            item.description ||
                            "No description"
                        }

                    </div>


                    <div
                        class="admin-media-details"
                    >

                        <strong>
                            Details:
                        </strong>

                        <br>

                        ${
                            item.details ||
                            "No details"
                        }

                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteMedia(${item.id})"
                    >

                        🗑 Delete This Media

                    </button>

                `;


                mediaList.appendChild(
                    container
                );

            }
        );

    }
    catch(error){

        console.error(error);

        mediaList.innerHTML =
            "Could not load media.";

    }

}


/* =====================================================
   DELETE MEDIA
===================================================== */

async function deleteMedia(id){

    const confirmed =
        confirm(
            "Are you sure you want to delete this photo or video?"
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
            await fetch(

                `/api/media/${id}`,

                {
                    method:"DELETE"
                }

            );


        const data =
            await response.json();


        if(data.success){

            alert(
                "Media deleted successfully!"
            );


            loadMedia();

        }
        else{

            alert(
                data.message ||
                "Delete failed."
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "Delete error. Check server."
        );

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        await supabase.auth.signOut();

    }
    catch(error){

        console.error(
            "Logout error:",
            error
        );

    }


    location.reload();

}


/* =====================================================
   START
===================================================== */

checkAdmin();

</script>


</body>

</html>
